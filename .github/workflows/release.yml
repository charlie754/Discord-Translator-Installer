name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pure Go behind the `cli` tag, so every target cross-compiles from one runner.
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            out: DiscordTranslatorInstallerCli.exe
          - goos: linux
            goarch: amd64
            out: DiscordTranslatorInstallerCli-linux
          - goos: darwin
            goarch: arm64
            out: DiscordTranslatorInstallerCli-darwin-arm64
          - goos: darwin
            goarch: amd64
            out: DiscordTranslatorInstallerCli-darwin-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # buildinfo.InstallerTag and InstallerGitHash default to "Unknown", and
      # self_updater.go computes IsSelfOutdated as `res.TagName != InstallerTag`.
      # Without these ldflags the shipped installer reports "Version: Unknown
      # (Unknown) - OUTDATED" on every run and tries to self-update forever,
      # because "Unknown" can never equal the latest tag.
      - name: Build CLI
        run: go build -tags cli -ldflags "-X discordtranslator/buildinfo.InstallerTag=${{ github.ref_name }} -X discordtranslator/buildinfo.InstallerGitHash=${{ github.sha }}" -o "dist/${{ matrix.out }}" .
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      # Same gate as the GUI job. The CLI job had none at all, so a command-line
      # installer could ship with any URL compiled in and nothing would notice.
      - name: Verify the compiled URLs
        shell: bash
        run: |
          bin="dist/${{ matrix.out }}"

          # Where desktop.asar comes from. Present in every build.
          if ! grep -q "Discord-Translator-Client" "$bin"; then
            echo "FAIL: the client release URL is not in the binary."
            exit 1
          fi

          # The exact artifact that shipped for five releases: an org that does not
          # exist, which 404s, whose 9-byte body UpdateSelf wrote over the executable.
          if grep -q "Discord Translator/Discord Translator Installer" "$bin"; then
            echo "FAIL: the binary contains the broken spaced self-update URL."
            exit 1
          fi

          # Self-update is disabled on macOS - CanUpdateSelf() returns
          # `IsSelfOutdated && runtime.GOOS != "darwin"`, which the compiler folds to
          # false on a darwin build, so the linker drops GetInstallerDownloadLink and
          # its strings entirely. Asserting the URL is PRESENT there fails a correct
          # build, which is exactly what happened on the first run of this gate. Assert
          # the design instead: present off darwin, absent on it.
          if [[ "$bin" == *darwin* ]]; then
            if grep -q "https://github.com/charlie754/Discord-Translator-Installer/releases/latest/download/" "$bin"; then
              echo "FAIL: a macOS build contains the self-update URL, but self-update"
              echo "is disabled on macOS. Either CanUpdateSelf changed or this is dead"
              echo "code that should not have survived."
              exit 1
            fi
            echo "Compiled URLs verified: client source present, self-update correctly absent on macOS."
          else
            if ! grep -q "https://github.com/charlie754/Discord-Translator-Installer/releases/latest/download/" "$bin"; then
              echo "FAIL: the self-update download URL is not in the binary."
              exit 1
            fi
            echo "Compiled URLs verified: client source, self-update source, no spaced artifact."
          fi


      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # The GUI links giu, an ImGui binding requiring cgo, so it cannot be
  # cross-compiled — each OS builds its own binary.
  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: DiscordTranslatorInstaller.exe
          - os: ubuntu-latest
            out: DiscordTranslatorInstaller-linux
          - os: macos-latest
            out: DiscordTranslatorInstaller-darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxxf86vm-dev

      # Without this the Windows .exe ships with Go's default icon: winres.json is
      # only read by go-winres, which generates the .syso the linker picks up, and
      # .syso files are gitignored so it must run in CI.
      - name: Embed Windows icon and version info
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres make
          if ! ls *.syso >/dev/null 2>&1; then
            echo "go-winres produced no .syso — the exe would ship with Go's default icon."
            exit 1
          fi
          ls -la *.syso

      # buildinfo.InstallerTag and InstallerGitHash default to "Unknown", and
      # self_updater.go computes IsSelfOutdated as `res.TagName != InstallerTag`.
      # Without these ldflags the shipped installer reports "Version: Unknown
      # (Unknown) - OUTDATED" on every run and tries to self-update forever,
      # because "Unknown" can never equal the latest tag.
      - name: Build GUI
        run: go build -ldflags "-X discordtranslator/buildinfo.InstallerTag=${{ github.ref_name }} -X discordtranslator/buildinfo.InstallerGitHash=${{ github.sha }}" -o "dist/${{ matrix.out }}" .

      # Proves the URLs actually compiled in, and that the broken ones did not.
      #
      # The previous version of this step grepped only for "Discord-Translator-Client",
      # the repo the desktop.asar is fetched from. That string was always present, so
      # the gate passed for every release while the installer's OWN self-update URL was
      # "https://github.com/Discord Translator/Discord Translator Installer/..." — a
      # find-replace artifact naming a nonexistent org. GitHub answered 404 and the
      # 9-byte body was written over the user's executable.
      #
      # Grepping for a repo NAME cannot catch a wrong PATH: "Discord-Translator-Installer"
      # also appears in constants.go, so that would have passed too. Assert the exact
      # download prefix, and assert the broken form is absent.
      - name: Verify the compiled URLs
        shell: bash
        run: |
          bin="dist/${{ matrix.out }}"

          # Where desktop.asar comes from. Present in every build.
          if ! grep -q "Discord-Translator-Client" "$bin"; then
            echo "FAIL: the client release URL is not in the binary."
            exit 1
          fi

          # The exact artifact that shipped for five releases: an org that does not
          # exist, which 404s, whose 9-byte body UpdateSelf wrote over the executable.
          if grep -q "Discord Translator/Discord Translator Installer" "$bin"; then
            echo "FAIL: the binary contains the broken spaced self-update URL."
            exit 1
          fi

          # Self-update is disabled on macOS - CanUpdateSelf() returns
          # `IsSelfOutdated && runtime.GOOS != "darwin"`, which the compiler folds to
          # false on a darwin build, so the linker drops GetInstallerDownloadLink and
          # its strings entirely. Asserting the URL is PRESENT there fails a correct
          # build, which is exactly what happened on the first run of this gate. Assert
          # the design instead: present off darwin, absent on it.
          if [[ "$bin" == *darwin* ]]; then
            if grep -q "https://github.com/charlie754/Discord-Translator-Installer/releases/latest/download/" "$bin"; then
              echo "FAIL: a macOS build contains the self-update URL, but self-update"
              echo "is disabled on macOS. Either CanUpdateSelf changed or this is dead"
              echo "code that should not have survived."
              exit 1
            fi
            echo "Compiled URLs verified: client source present, self-update correctly absent on macOS."
          else
            if ! grep -q "https://github.com/charlie754/Discord-Translator-Installer/releases/latest/download/" "$bin"; then
              echo "FAIL: the self-update download URL is not in the binary."
              exit 1
            fi
            echo "Compiled URLs verified: client source, self-update source, no spaced artifact."
          fi


      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: dist/*

  publish:
    needs: [cli, gui]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Installer for **Discord Translator**.

            Download the binary for your platform and run it. It patches your
            Discord desktop app by installing `desktop.asar` from the latest
            [Discord Translator Client](https://github.com/charlie754/Discord-Translator-Client/releases/latest)
            release. Discord must be fully closed first.

            `DiscordTranslatorInstaller*` are the graphical installers;
            `DiscordTranslatorInstallerCli*` are the command-line versions.

            These binaries are not code-signed. Windows will show a SmartScreen
            warning and macOS will require right-click → Open the first time.

            GPL-3.0, derived from Equilotl. See NOTICE in the repository.
